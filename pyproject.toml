[project]
name = "oobleck"
description = "Heterogeneous elastic pipeline training for Cornstarch."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
version = "0.2.0"
authors = [{name = "Insu Jang", email = "insujang@umich.edu"}]
dependencies = [
    "torch>=2.6.0",
    "datasets>=2.18.0",
    "tyro>=0.8.0",
    "loguru>=0.7.0",
    "cornstarch @ git+https://github.com/cornstarch-org/Cornstarch.git@71cf4ad681cfefdbf4a5b61d524af9033bebd055",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
oobleck = "oobleck.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/refactor"]

[tool.pyright]
include = [
    "oobleck/config.py",
    "oobleck/types.py",
    "oobleck/data.py",
    "oobleck/data_base.py",
    "oobleck/acceptance.py",
    "oobleck/state_base.py",
    "oobleck/state_transfer.py",
    "oobleck/planning",
    "oobleck/elastic/hostfile.py",
    "oobleck/elastic/membership.py",
    "oobleck/elastic/transport.py",
    "benchmarks",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.setuptools.packages.find]
where = ["."]
include = ["oobleck*"]
exclude = ["examples*", "tests*"]

[[tool.setuptools-rust.ext-modules]]
target = "oobleck.planning.planner"
path = "Cargo.toml"
binding = "PyO3"

[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"
